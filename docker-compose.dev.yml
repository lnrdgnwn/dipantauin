services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@mysql:3306/${DB_NAME:?DB_NAME is required}
      PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: npm run dev -w @dipantauin/api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - web_next_cache:/app/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -w @dipantauin/web -- --hostname 0.0.0.0

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: build
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@mysql:3306/${DB_NAME:?DB_NAME is required}
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    command: npm run dev -w @dipantauin/worker

volumes:
  mysql_dev_data:
  root_node_modules:
  web_next_cache:
